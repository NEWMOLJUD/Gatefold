name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      # `npm run test` regenerates wrangler.jsonc; a difference means it was not committed.
      - name: wrangler.jsonc is up to date
        run: git diff --exit-code -- wrangler.jsonc
      # The update commands lean on the machinery's own update code and on a few lines of package.json.
      - name: The Gatefold commands have what they depend on
        run: node gatefold/update.ts check
      # A tag is a release: installations refuse one whose files do not say the version of its name.
      - name: The tag is a consistent release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node gatefold/update.ts check --release
          test "v$(node -p "require('./gatefold/manifest.json').version")" = "$GITHUB_REF_NAME"
